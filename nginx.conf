server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Redirect bare host to the app's base path (Vite builds under /sathwick-portfolio/).
    location = / {
        return 302 /sathwick-portfolio/;
    }

    # Hashed, immutable build assets — long cache.
    location /sathwick-portfolio/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA shell: fall back to index.html for unknown paths under the base.
    location /sathwick-portfolio/ {
        try_files $uri $uri/ /sathwick-portfolio/index.html;
    }
}
